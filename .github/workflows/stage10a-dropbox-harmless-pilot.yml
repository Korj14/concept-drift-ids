name: Stage-10A harmless Dropbox pilot — no checkpoints

on:
  push:
    branches:
      - stage10a-governance
    paths:
      - '.github/stage10a-requests/pilot-*.json'

permissions:
  contents: read

concurrency:
  group: stage10a-dropbox-harmless-pilot
  cancel-in-progress: false

jobs:
  harmless-pilot:
    if: github.repository == 'Korj14/concept-drift-ids' && github.ref == 'refs/heads/stage10a-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: stage10a-checkpoint-verification
    steps:
      - name: Checkout commit, without reusable credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require exact clean HEAD and exactly one pilot request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git switch -C stage10a-governance "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          [[ "$CHANGED" =~ ^\.github/stage10a-requests/pilot-[0-9a-f]{16}\.json$ ]]
          test -f "$CHANGED"
          echo "request=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up exact Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Harmless single-use Dropbox GET, SHA-256 and no-data receipt
        env:
          STAGE10A_PILOT_DOWNLOAD_URL: ${{ secrets.STAGE10A_PILOT_DOWNLOAD_URL }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          DIR="$RUNNER_TEMP/stage10a-harmless-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$DIR"
          python -m tools.stage10.stage10a_dropbox_harmless_pilot \
            --request '${{ steps.request.outputs.request }}' \
            --output "$DIR/receipt.json"
          test -z "$(git status --porcelain)"
          echo "STAGE10A_PILOT_RECEIPT=$DIR/receipt.json" >> "$GITHUB_ENV"

      - name: Preserve sanitized harmless-fixture receipt only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage10a-harmless-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STAGE10A_PILOT_RECEIPT }}
          retention-days: 7
          if-no-files-found: error
          overwrite: false

      - name: Best-effort cleanup on success or failure
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/stage10a-harmless-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
