name: Stage 9 robustness contract

on:
  push:
    branches:
      - "stage9-*"
      - "stage8-cd-primary-evaluation"
  pull_request:

jobs:
  stage9-contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Verify interpreter
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 9), sys.version"

      - name: Install frozen environment
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify Stage 9 governance artifacts
        shell: pwsh
        run: |
          $required = @(
            "STAGE9_PRESPECIFIED_ROBUSTNESS_PROTOCOL.md",
            "STAGE9_IMPLEMENTATION.md",
            "src/concept_drift_ids/cd_stage9_config.py",
            "src/concept_drift_ids/cd_stage9_monitor.py",
            "src/concept_drift_ids/cd_stage9_shared_runner.py",
            "src/concept_drift_ids/cd_stage9_offline.py",
            "src/concept_drift_ids/cd_stage9_phase_a.py",
            "src/concept_drift_ids/cd_stage9_phase_b.py",
            "src/concept_drift_ids/cd_stage9_phase_c.py",
            "src/concept_drift_ids/cd_stage9_export.py",
            "tests/test_cd_stage9_unit.py",
            "run_stage9.py",
            "scripts/run_stage9.ps1"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing Stage-9 artifact: $path" }
          }

      - name: Compile Stage 9 source
        shell: pwsh
        run: |
          python -m compileall -q src/concept_drift_ids run_stage9.py

      - name: Run Stage 9 repository-only tests
        shell: pwsh
        run: |
          python -m pytest tests/test_cd_stage9_unit.py -q

      - name: Run Stage 8 regression tests
        shell: pwsh
        run: |
          python -m pytest tests/test_cd_primary_stage8_unit.py tests/test_cd_primary_mechanism_unit.py -q
