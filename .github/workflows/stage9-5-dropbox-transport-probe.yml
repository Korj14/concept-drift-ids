name: Stage 9.5 Dropbox transport probe

on:
  push:
    branches:
      - "stage9-5-q1-assurance"

jobs:
  checkpoint-family-transport-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Read current PR 21 transport envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/21" --jq .body > pr_body.txt

      - name: Download and verify exact checkpoint family
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          START = "<!-- STAGE9_5_DROPBOX_TRANSPORT_BEGIN"
          END = "STAGE9_5_DROPBOX_TRANSPORT_END -->"
          EXPECTED = {
              "/seed_0.pt": {
                  "sha256": "514c6d552b3cd680ae966bbb568105bd2871bc68d3a47aded070a70ba0615bd1",
                  "size": 76105,
              },
              "/seed_1.pt": {
                  "sha256": "07696c3f580645d9c96ac3e736cfb5eeaa8033f148bf64822e8ee105861cf552",
                  "size": 76105,
              },
              "/seed_2.pt": {
                  "sha256": "7630514cf409256bd2bbe27eca59f881acb238be698b5fdb1ee12bca8e402491",
                  "size": 76105,
              },
              "/seed_3.pt": {
                  "sha256": "cce1ce47db047b9d441bbe6dad9bd53f1ee6ff3ad7d404521cae72a38bccd4b4",
                  "size": 76105,
              },
              "/seed_4.pt": {
                  "sha256": "9b9e56371f3246482998c4efea4829e1e6d5aaf549bb43e1af05e471dfcb9e93",
                  "size": 76105,
              },
          }

          report_path = Path("transport_probe_report.json")
          body = Path("pr_body.txt").read_text(encoding="utf-8")
          report = {
              "audit_id": "stage9.5-dropbox-transport-probe-checkpoint-family-v1",
              "repository_head": os.environ["GITHUB_SHA"],
              "expected_paths": sorted(EXPECTED),
              "results": [],
              "raw_bytes_preserved_after_probe": False,
              "stage10_outcomes_accessed": False,
          }

          if START not in body or END not in body:
              report.update({"status": "no_transport_envelope", "pass": False})
              report_path.write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          payload_text = body.split(START, 1)[1].split(END, 1)[0].strip()
          envelope = json.loads(payload_text)
          if not isinstance(envelope, dict):
              raise TypeError("Transport envelope must be a JSON object.")
          files = envelope.get("files")
          if not isinstance(files, list):
              raise ValueError("Transport envelope files must be a list.")

          by_path: dict[str, str] = {}
          for item in files:
              if not isinstance(item, dict):
                  raise ValueError("Transport envelope file item must be an object.")
              path = item.get("path")
              encoded_url = item.get("download_url_b64")
              if not isinstance(path, str) or not isinstance(encoded_url, str):
                  raise ValueError("Transport envelope file item is malformed.")
              if path in by_path:
                  raise ValueError(f"Duplicate transport path: {path}")
              by_path[path] = encoded_url

          if set(by_path) != set(EXPECTED):
              raise ValueError("Transport envelope does not contain exactly seeds 0-4.")

          overall_pass = True
          for path in sorted(EXPECTED):
              expected = EXPECTED[path]
              encoded_url = by_path[path]
              try:
                  url = base64.b64decode(encoded_url, validate=True).decode("utf-8")
              except Exception as exc:
                  raise ValueError(f"Invalid base64 URL for {path}.") from exc
              if not re.match(r"^https://[^/]+\.dl\.dropboxusercontent\.com/", url):
                  raise ValueError(f"Decoded URL is not a Dropbox raw-download URL: {path}")

              target = Path(path.lstrip("/"))
              result = {
                  "path": path,
                  "expected_sha256": expected["sha256"],
                  "expected_size_bytes": expected["size"],
                  "actual_sha256": None,
                  "actual_size_bytes": None,
                  "pass": False,
              }
              try:
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "stage9.5-dropbox-transport-probe-v1"},
                          method="GET",
                      )
                      with urllib.request.urlopen(request, timeout=120) as response:
                          with target.open("wb") as handle:
                              while True:
                                  chunk = response.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  handle.write(chunk)
                  except Exception as exc:
                      result["status"] = "download_error"
                      result["error_type"] = type(exc).__name__
                      result["http_status"] = getattr(exc, "code", None)
                      overall_pass = False
                  else:
                      data = target.read_bytes()
                      actual_sha256 = hashlib.sha256(data).hexdigest()
                      actual_size = len(data)
                      passed = (
                          actual_sha256 == expected["sha256"]
                          and actual_size == expected["size"]
                      )
                      result.update(
                          {
                              "status": "pass" if passed else "identity_mismatch",
                              "pass": passed,
                              "actual_sha256": actual_sha256,
                              "actual_size_bytes": actual_size,
                          }
                      )
                      overall_pass = overall_pass and passed
              finally:
                  target.unlink(missing_ok=True)
              report["results"].append(result)

          report.update(
              {
                  "status": "pass" if overall_pass else "failed",
                  "pass": overall_pass,
                  "verified_paths": [
                      item["path"] for item in report["results"] if item["pass"]
                  ],
              }
          )
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if not overall_pass:
              raise SystemExit("Checkpoint-family transport probe failed.")
          PY

      - name: Upload small transport verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-5-dropbox-transport-probe-checkpoint-family-v1
          path: transport_probe_report.json
          if-no-files-found: error
