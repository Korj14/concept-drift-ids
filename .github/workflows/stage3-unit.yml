name: Research contract

on:
  push:
    branches:
      - main
      - 'stage*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Verify interpreter
        run: |
          python --version
          python - <<'PY'
          import sys
          assert sys.version_info[:3] == (3, 11, 9), sys.version
          PY

      - name: Verify repository governance artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "GOVERNING_SOURCES.md",
              "RESEARCH_DOCTRINE.md",
              "METHODOLOGY_LEDGER.md",
              "EXPERIMENT_CONTROL_REGISTER.md",
              "STATISTICAL_ANALYSIS_PLAN.md",
              "REPOSITORY_GOVERNANCE.md",
              "VISUALIZATION_POLICY.md",
              "LITERATURE_WATCH.md",
              "SYSTEM_A_PROTOCOL.md",
              "SYSTEM_B_PROTOCOL.md",
              "SYSTEM_B_Q1_AUDIT.md",
              "SYSTEM_B_ROBUSTNESS_PLAN.md",
              "SYSTEM_B_R0_V2_CORRECTION_PLAN.md",
              "SYSTEM_B_V2_EVALUATION_PROTOCOL.md",
              "C_D_ADVERSARIAL_DESIGN_AUDIT.md",
              "C_D_STREAM_TIME_CONTRACT.md",
              "C_D_DRIFT_MONITOR_PROTOCOL.md",
              "C_D_NEURAL_ADAPTATION_PROTOCOL.md",
              "C_D_FUSION_THRESHOLD_PROTOCOL.md",
              "D_SYMBOLIC_LIFECYCLE_PROTOCOL.md",
              "D_TRIGGER_ABLATION_PROTOCOL.md",
              "C_D_FINAL_ANALYSIS_REPRODUCIBILITY_PROTOCOL.md",
              "STAGE5_HANDOFF.md",
              "STAGE6_CONTROL_PLANE_IMPLEMENTATION.md",
              "STAGE6_HANDOFF.md",
              "STAGE7_SYMBOLIC_IMPLEMENTATION.md",
              "STAGE7_HANDOFF.md",
              "STAGE8_PRIMARY_EXECUTION_PROTOCOL.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          assert not missing, f"Missing governance artifacts: {missing}"

          gap = (
              "Prior work has separately demonstrated concept-drift-aware adaptation "
              "of predictive IDS models"
          )
          doctrine = Path("RESEARCH_DOCTRINE.md").read_text(encoding="utf-8")
          assert gap in doctrine, "Repository doctrine is missing the governing gap."

          sap = Path("STATISTICAL_ANALYSIS_PLAN.md").read_text(encoding="utf-8")
          assert "**Version:** 1.0 — frozen prospective C/D analysis plan" in sap, (
              "C/D statistical analysis plan is not frozen at v1.0."
          )
          assert "TBD BEFORE C/D" not in sap, (
              "C/D statistical analysis plan contains unresolved confirmatory TBDs."
          )
          assert "TBD BEFORE longitudinal adaptive evaluation" not in sap, (
              "C/D statistical analysis plan contains unresolved recovery TBDs."
          )

          controls = Path("EXPERIMENT_CONTROL_REGISTER.md").read_text(encoding="utf-8")
          unresolved_status = [
              line for line in controls.splitlines()
              if line.startswith("|") and (
                  "**TO FREEZE" in line
                  or "VALUES TO FREEZE" in line
                  or "HASH TO FREEZE" in line
                  or "ARTIFACT TO FREEZE" in line
                  or "MANIFEST TO FREEZE" in line
              )
          ]
          assert not unresolved_status, (
              "Control register contains unresolved freeze-state rows: "
              + " || ".join(unresolved_status)
          )
          PY

      - name: Install frozen environment
        run: python -m pip install -r requirements-lock.txt

      - name: Run Stage 3 repository-only tests
        run: python -m pytest -q tests/test_model_preprocessing.py tests/test_system_a_unit.py tests/test_symbolic_unit.py tests/test_system_b_unit.py tests/test_system_b_frozen_contract.py tests/test_system_b_frozen_evaluation_contract.py tests/test_system_b_supplement_unit.py tests/test_system_b_r0_protocol_audit_contract.py tests/test_system_b_r0_v2_unit.py tests/test_system_b_r0_v2_frozen_contract.py tests/test_system_b_v2_evaluation_unit.py tests/test_system_b_v2_frozen_evaluation_contract.py tests/test_system_b_audit_unit.py tests/test_system_b_semantic_analysis_unit.py tests/test_governance_sources.py tests/test_system_b_dtype_audit_unit.py tests/test_retrospective_scenario_audit_unit.py tests/test_system_ab_seen_unseen_unit.py tests/test_system_b_selection_robustness_unit.py tests/test_system_b_selection_robustness_evaluation_unit.py tests/test_system_b_duplicate_robustness_unit.py tests/test_system_a_duplicate_robustness_unit.py tests/test_system_b_fusion_robustness_unit.py tests/test_system_b_cli_dispatch_unit.py tests/test_system_b_dedup_teacher_robustness_unit.py tests/test_system_b_dedup_teacher_evaluation_unit.py

      - name: Run Stage 6 repository-only tests
        run: python -m pytest -q tests/test_cd_control_plane_unit.py tests/test_cd_evidence_unit.py tests/test_cd_shared_runner_unit.py tests/test_cd_runtime_unit.py

      - name: Run Stage 7 repository-only tests
        run: python -m pytest -q tests/test_cd_symbolic_lifecycle_unit.py tests/test_cd_symbolic_candidates_unit.py tests/test_cd_symbolic_arms_analysis_unit.py tests/test_cd_symbolic_runner_evidence_unit.py tests/test_cd_implementation_preflight_unit.py

      - name: Run Stage 8 repository-only tests
        run: python -m pytest -q tests/test_cd_primary_stage8_unit.py

      - name: Run Stage 2 repository-only regression tests
        run: python -m pytest -q tests/test_sudden_benign_manifest.py -k "not provenance_files_still_match_frozen_manifest"
